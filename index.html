<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Moliya nazorati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0F4; --card:#fff; --ink:#151B26; --soft:#5F6B7E; --rule:#D8DDE6;
  --navy:#1B3A6B; --navy-soft:#E4EBF6; --green:#1B8A5A; --green-soft:#E2F2EA;
  --amber:#B37309; --amber-soft:#FBF0DC; --rose:#B03B3B; --rose-soft:#FAE8E8;
  --violet:#5B4B8A; --violet-soft:#ECE8F6; --teal:#137A82; --teal-soft:#DFF0F1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;font-size:15px}
.disp{font-family:'Space Grotesk',sans-serif}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
input,select,textarea,button{font-family:inherit}
input,select,textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--rule);background:#fff;color:var(--ink);font-size:14px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
label.lb{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:5px;display:block}
.btn{padding:9px 15px;border-radius:8px;border:1px solid var(--rule);background:#fff;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer}
.btn-main{background:var(--navy);color:#fff;border:none;font-weight:600}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--rule)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpi{padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--rule);min-width:150px}
.kpi b{display:block;font-size:18px;font-weight:600;line-height:1.25}
.kpi u{display:block;font-size:12.5px;font-weight:500;text-decoration:none;opacity:.85}
.kpi span{font-size:12px;color:var(--soft)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.nav button{padding:9px 16px;border-radius:9px;border:1px solid var(--rule);background:#fff;color:var(--soft);font-size:13.5px;font-weight:600;cursor:pointer}
.nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip{padding:7px 12px;border-radius:8px;background:var(--card);border:1px solid var(--rule);cursor:pointer;font-size:13px;display:flex;align-items:baseline;gap:6px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px}
.qator{display:flex;gap:14px;padding:14px 16px;border-top:1px solid var(--rule);transition:background .15s}
.qator:first-child{border-top:none}
.qator:hover{background:#F7F9FC}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.modal{position:fixed;inset:0;background:rgba(21,27,38,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:660px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0}
.sheet-h{padding:18px 20px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:center;z-index:2}
.sheet-b{padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet-f{padding:14px 20px;border-top:1px solid var(--rule);position:sticky;bottom:0;background:#fff;display:flex;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.bolim{font-size:11px;padding:3px 9px;border-radius:6px;font-weight:600}
.center{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.banner{padding:11px 13px;border-radius:8px;font-size:13px;line-height:1.5;margin-bottom:12px}
.hidden{display:none!important}
.bar{height:7px;background:var(--paper);border-radius:4px;overflow:hidden}
hr.sep{border:none;border-top:1px solid var(--rule);margin:2px 0}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;color:var(--soft);font-size:12px;padding:6px 8px;font-weight:600}
table.tbl td{padding:8px;border-top:1px solid var(--rule)}
@media(max-width:680px){.qator{flex-wrap:wrap}.g2,.g3{grid-template-columns:1fr}.acts{width:100%;justify-content:flex-start!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="gate" class="center">
  <div class="card" style="max-width:390px;width:100%;padding:28px">
    <div class="mono" style="font-size:11px;letter-spacing:.12em;color:var(--navy);margin-bottom:10px">RAHBAR PANELI</div>
    <h1 class="disp" style="font-size:26px;margin:0;line-height:1.2">Moliya nazorati</h1>
    <p id="gateText" style="font-size:14px;color:var(--soft);margin:10px 0 20px;line-height:1.5"></p>
    <input type="password" id="gateInput" placeholder="Kirish kodi" autocomplete="off">
    <div id="gateErr" style="color:var(--rose);font-size:13px;margin-top:8px"></div>
    <button id="gateBtn" class="btn btn-main" style="width:100%;margin-top:14px;padding:11px 0;font-size:14px"></button>
    <button id="setupBtn" class="btn" style="width:100%;margin-top:8px;padding:9px 0;font-size:13px">Baza sozlamalari</button>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <div class="wrap" style="padding-top:16px;padding-bottom:14px">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div>
        <div class="mono" style="font-size:10.5px;letter-spacing:.14em;color:var(--navy)" id="todayLbl"></div>
        <h1 class="disp" style="font-size:25px;margin:4px 0 0;letter-spacing:-.01em">Moliya nazorati</h1>
      </div>
      <div class="row">
        <button class="btn" onclick="csvYukla()">Excel'ga yuklash</button>
        <button class="btn" onclick="sozlamaOch()">Sozlama</button>
        <button class="btn" onclick="chiqish()">Chiqish</button>
        <button class="btn btn-main" id="qoshBtn" onclick="yangiOch()">+ Yangi yozuv</button>
      </div>
    </div>
    <div class="nav" id="nav"></div>
  </div>
</header>

<div class="wrap" style="padding-top:16px">
  <div id="banner"></div>
  <div class="row" id="kpis" style="margin-bottom:14px"></div>

  <div id="bolimBlok" style="margin-bottom:10px">
    <div style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:7px">Bo'limlar</div>
    <div class="row" id="bolimChips"></div>
  </div>

  <div class="row" id="filtrlar">
    <input id="qidiruv" placeholder="Qidirish…" style="flex:1 1 220px;max-width:340px">
    <select id="fTur" style="width:auto">
      <option value="hammasi">Kirim va chiqim</option>
      <option value="kirim">Faqat kirim</option>
      <option value="chiqim">Faqat chiqim</option>
    </select>
    <select id="fValyuta" style="width:auto">
      <option value="hammasi">Barcha valyuta</option>
      <option value="UZS">So'm</option>
      <option value="USD">Dollar</option>
    </select>
    <input type="month" id="fOy" style="width:auto" title="Oy bo'yicha filtr">
    <button class="btn" onclick="oyTozala()">Barcha oylar</button>
  </div>
</div>

<main class="wrap" style="padding-top:16px;padding-bottom:40px">
  <div id="list"></div>
  <div id="statView" class="hidden"></div>
  <p id="modeNote" style="font-size:12px;color:var(--soft);margin-top:16px;line-height:1.5"></p>
</main>
</div>

<div id="formModal" class="modal hidden">
  <div class="sheet">
    <div class="sheet-h">
      <h2 class="disp" id="formTitle" style="font-size:18px;margin:0"></h2>
      <button onclick="formYop()" style="background:none;border:none;font-size:22px;color:var(--soft);cursor:pointer;line-height:1">&times;</button>
    </div>
    <div class="sheet-b" id="formBody"></div>
    <div class="sheet-f">
      <button class="btn" style="flex:1;padding:11px 0" onclick="formYop()">Bekor qilish</button>
      <button class="btn btn-main" style="flex:2;padding:11px 0;font-size:14px" onclick="saqla()">Saqlash</button>
    </div>
  </div>
</div>

<div id="setupModal" class="modal hidden">
  <div class="sheet" style="max-width:560px">
    <div class="sheet-h">
      <h2 class="disp" style="font-size:18px;margin:0">Baza sozlamalari</h2>
      <button onclick="sozlamaYop()" style="background:none;border:none;font-size:22px;color:var(--soft);cursor:pointer;line-height:1">&times;</button>
    </div>
    <div class="sheet-b">
      <div><label class="lb">Supabase URL</label><input id="s_url" placeholder="https://xxxx.supabase.co"></div>
      <div><label class="lb">Anon key</label><input id="s_key" placeholder="eyJhbGci..."></div>
      <div><label class="lb">Kirish kodi (parol)</label><input id="s_kod" placeholder="Rahbar uchun kod">
        <span style="font-size:12px;color:var(--soft)">Parolni almashtirish uchun yangisini yozing va saqlang.</span></div>
      <div><label class="lb">Dollar kursi (1 USD = ? so'm)</label><input id="s_kurs" inputmode="numeric" placeholder="12800">
        <span style="font-size:12px;color:var(--soft)">Statistikada umumiy jamini so'mda ko'rsatish uchun.</span></div>
      <div id="setupErr" style="font-size:13px;color:var(--rose)"></div>
      <div id="setupOk" style="font-size:13px;color:var(--green)"></div>
    </div>
    <div class="sheet-f">
      <button class="btn" style="flex:1;padding:11px 0" onclick="sozlamaYop()">Yopish</button>
      <button class="btn btn-main" style="flex:2;padding:11px 0;font-size:14px" onclick="sozlamaSaqla()">Saqlash va tekshirish</button>
    </div>
  </div>
</div>

<div id="delModal" class="modal hidden" style="align-items:center">
  <div class="card" style="max-width:340px;width:100%;padding:22px;margin:0 20px">
    <h3 class="disp" style="font-size:17px;margin:0 0 6px">Yozuv o'chirilsinmi?</h3>
    <p style="font-size:14px;color:var(--soft);margin:0 0 18px">Bu amalni qaytarib bo'lmaydi.</p>
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1;padding:10px 0" onclick="delYop()">Bekor qilish</button>
      <button class="btn" style="flex:1;padding:10px 0;background:var(--rose);color:#fff;border:none;font-weight:600" onclick="delTasdiq()">O'chirish</button>
    </div>
  </div>
</div>

<script>
/* ═══════════ SOZLAMA ═══════════ */
const LS="moliya_v1", LS_CFG="moliya_cfg_v1", LS_SES=LS_CFG+"_ses", JADVAL="moliya";

const MODUL = {
  xodim:    {nom:"Xodimlar",       qosh:"+ Xodim to'lovi"},
  moliya:   {nom:"Kirim / Chiqim", qosh:"+ Kirim yoki chiqim"},
  lab:      {nom:"Laboratoriya",   qosh:"+ Laboratoriya yozuvi"},
  planbaby: {nom:"Plan Baby",      qosh:"+ Plan Baby yozuvi"},
  stat:     {nom:"Statistika",     qosh:null}
};

const BOLIMLAR = [
  ["Urologiya","var(--navy)","var(--navy-soft)"],
  ["Ginekologiya","var(--rose)","var(--rose-soft)"],
  ["Anesteziolog","var(--teal)","var(--teal-soft)"],
  ["Laboratoriya","var(--violet)","var(--violet-soft)"],
  ["Medik vakil","var(--amber)","var(--amber-soft)"],
  ["Registratura","var(--green)","var(--green-soft)"],
  ["Hamshiralar","var(--amber)","var(--amber-soft)"],
  ["Farrosh","var(--teal)","var(--teal-soft)"],
  ["Media","var(--violet)","var(--violet-soft)"],
  ["Administratsiya","var(--navy)","var(--navy-soft)"]
];

/* To'lov maydonlari — bo'limga qarab o'zgaradi */
const MAYDON = {
  oylik:    {nom:"Oylik ish haqi"},
  kpi:      {nom:"KPI (bonus)"},
  opkpi:    {nom:"Operatsiya KPI"},
  konskpi:  {nom:"Konsultatsiya KPI"},
  narkozk:  {nom:"Kichik operatsiya narkoz"},
  narkozb:  {nom:"Katta operatsiya narkoz"},
  lab:      {nom:"Laboratoriya KPI"},
  navbat:   {nom:"Navbatchilik (dejur)"},
  navbatKun:{nom:"Navbatchilik kunlari", hisobsiz:true},
  jarima:   {nom:"Jarima (−)", minus:true}
};
const STANDART = ["oylik","kpi","lab","navbat","navbatKun","jarima"];
const TOLOV = {
  "Urologiya":    ["oylik","kpi","opkpi","konskpi","lab","navbat","navbatKun","jarima"],
  "Ginekologiya": ["oylik","kpi","opkpi","konskpi","lab","navbat","navbatKun","jarima"],
  "Anesteziolog": ["oylik","narkozk","narkozb","konskpi","kpi","navbat","navbatKun","jarima"],
  "Medik vakil":  ["opkpi","lab","kpi"]
};
function tolovMaydonlari(bolim){ return TOLOV[bolim] || STANDART; }

const KAT_MOLIYA = ["Bemor to'lovi","Operatsiya","Konsultatsiya","UTT / Diagnostika","Ijara","Kommunal to'lov","Dori-darmon","Jihoz / ta'mir","Reklama","Soliq","Boshqa"];
const KAT_LAB    = ["Laboratoriya daromadi","Reagent xaridi","Sarf materiallar","Jihoz / ta'mir","Xodim oyligi","Xodim KPI","Boshqa"];

const TUR={chiqim:{label:"Chiqim",c:"var(--rose)",bg:"var(--rose-soft)"},kirim:{label:"Kirim",c:"var(--green)",bg:"var(--green-soft)"}};
const VAL={UZS:"So'm",USD:"Dollar $"};

let cfg={url:"",key:"",kod:"",kurs:"12800"};
let data=[], bulut=false;
let tahrirId=null, ochirishId=null, modul="xodim", bolimFiltr=null, formTur="chiqim", formVal="UZS";

/* ═══════════ YORDAMCHI ═══════════ */
const $=id=>document.getElementById(id);
const bugun=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const son=v=>{const n=parseFloat(String(v??"").replace(/[^\d.-]/g,""));return isNaN(n)?0:n;};
const pul=n=>(Math.round(n)||0).toLocaleString("ru-RU").replace(/,/g," ");
const val=v=>v==="USD"?"USD":"UZS";
function pulV(n,v){ return v==="USD" ? "$"+pul(n) : pul(n)+" so'm"; }
const kurs=()=>Math.max(1,son(cfg.kurs)||12800);
const somga=(n,v)=> v==="USD" ? n*kurs() : n;

function sana(d){ if(!d) return "—"; const p=d.split("-"); return `${p[2]}.${p[1]}.${p[0]}`; }
function oyNomi(k){ const p=k.split("-");
  return ["","Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"][+p[1]]+" "+p[0]; }

function jamiXodim(y){
  let s=0;
  Object.keys(MAYDON).forEach(function(k){
    const m=MAYDON[k]; if(m.hisobsiz) return;
    s += m.minus ? -son(y[k]) : son(y[k]);
  });
  return s;
}
function summa(y){ return (y.modul==="xodim"||!y.modul) ? jamiXodim(y) : son(y.summa); }
function bolimRang(b){ const x=BOLIMLAR.find(z=>z[0]===b); return x?{c:x[1],bg:x[2]}:{c:"var(--soft)",bg:"var(--paper)"}; }

function banner(matn,tur){
  const b=$("banner");
  if(!matn){ b.innerHTML=""; return; }
  const r=tur==="xato"?["var(--rose-soft)","var(--rose)"]:["var(--amber-soft)","var(--amber)"];
  b.innerHTML=`<div class="banner" style="background:${r[0]};color:${r[1]}">${esc(matn)}</div>`;
}

/* ═══════════ SAQLASH ═══════════ */
function cfgYukla(){
  try{ const c=JSON.parse(localStorage.getItem(LS_CFG)||"{}");
    cfg={url:c.url||"",key:c.key||"",kod:c.kod||"",kurs:c.kurs||"12800"}; }catch{}
}
function cfgSaqla(){ localStorage.setItem(LS_CFG,JSON.stringify(cfg)); }

async function sb(yol,opt){
  opt=opt||{};
  const r=await fetch(cfg.url.replace(/\/$/,"")+"/rest/v1/"+yol,Object.assign({},opt,{
    headers:Object.assign({apikey:cfg.key,Authorization:"Bearer "+cfg.key,"Content-Type":"application/json",Prefer:"return=representation"},opt.headers||{})}));
  if(!r.ok) throw new Error("Baza xatosi "+r.status+": "+(await r.text()).slice(0,120));
  const t=await r.text(); return t?JSON.parse(t):[];
}

async function yukla(){
  if(cfg.url&&cfg.key){
    try{ data=await sb(JADVAL+"?select=*&order=no.desc"); bulut=true; banner("");
      localStorage.setItem(LS,JSON.stringify(data)); return;
    }catch(e){ bulut=false; banner("Bazaga ulanib bo'lmadi ("+e.message+"). Yozuvlar shu qurilmadan o'qilmoqda.","xato"); }
  }
  try{ data=JSON.parse(localStorage.getItem(LS)||"[]"); }catch{ data=[]; }
}

async function yoz(yozuv,amal){
  if(bulut){
    try{
      if(amal==="qosh") await sb(JADVAL,{method:"POST",body:JSON.stringify(yozuv)});
      if(amal==="yangila") await sb(JADVAL+"?id=eq."+encodeURIComponent(yozuv.id),{method:"PATCH",body:JSON.stringify(yozuv)});
      if(amal==="ochir") await sb(JADVAL+"?id=eq."+encodeURIComponent(yozuv.id),{method:"DELETE"});
      banner("");
    }catch(e){ banner("Bazaga yozilmadi ("+e.message+"). Ma'lumot shu qurilmada saqlandi.","xato"); }
  }
  localStorage.setItem(LS,JSON.stringify(data));
  holatKorsat();
}
function holatKorsat(){
  $("modeNote").textContent = bulut ? "Yozuvlar umumiy bazada saqlanmoqda."
    : "Yozuvlar faqat shu qurilmada saqlanmoqda. «Sozlama» dan bazani ulang.";
}

/* ═══════════ SESSIYA ═══════════ */
function sessiyaSaqla(){ try{ localStorage.setItem(LS_SES,String(Date.now()+30*864e5)); }catch{} }
function sessiyaBormi(){ try{ return Number(localStorage.getItem(LS_SES)||0)>Date.now(); }catch{ return false; } }
function chiqish(){
  if(!confirm("Chiqishni tasdiqlaysizmi? Keyingi safar kirish kodi so'raladi.")) return;
  try{ localStorage.removeItem(LS_SES); }catch{} location.reload();
}
function gateKorsat(){
  const yoq=!cfg.kod;
  $("gateText").textContent=yoq?"Kirish kodini o'rnating. Bu panel faqat rahbariyat uchun.":"Davom etish uchun kirish kodini kiriting.";
  $("gateBtn").textContent=yoq?"Kodni o'rnatish":"Kirish";
  $("gateInput").placeholder=yoq?"Yangi kod":"Kirish kodi";
  $("setupBtn").textContent=yoq?"Baza sozlamalari":"Sozlamalarni o'zgartirish";
}
$("gateBtn").onclick=async function(){
  const v=$("gateInput").value.trim();
  if(!cfg.kod){ if(v.length<4){$("gateErr").textContent="Kod kamida 4 ta belgidan iborat bo'lsin.";return;} cfg.kod=v; cfgSaqla(); await kir(); }
  else { if(v===cfg.kod) await kir(); else $("gateErr").textContent="Kod noto'g'ri."; }
};
$("gateInput").addEventListener("keydown",function(e){if(e.key==="Enter")$("gateBtn").click();});
$("gateInput").addEventListener("input",function(){$("gateErr").textContent="";});
$("setupBtn").onclick=sozlamaOch;

async function kir(){
  sessiyaSaqla();
  $("gate").classList.add("hidden"); $("app").classList.remove("hidden");
  $("todayLbl").textContent="RAHBAR PANELI · "+sana(bugun());
  await yukla(); holatKorsat(); chiz();
}

/* ═══════════ NAVIGATSIYA ═══════════ */
function modulSet(k){ modul=k; bolimFiltr=null; $("qidiruv").value=""; chiz(); window.scrollTo({top:0,behavior:"smooth"}); }

function navChiz(){
  $("nav").innerHTML=Object.keys(MODUL).map(function(k){
    return `<button class="${modul===k?"on":""}" onclick="modulSet('${k}')">${MODUL[k].nom}</button>`; }).join("");
  const q=MODUL[modul].qosh;
  $("qoshBtn").textContent=q||"";
  $("qoshBtn").classList.toggle("hidden",!q);
  $("bolimBlok").classList.toggle("hidden",modul!=="xodim");
  $("filtrlar").classList.toggle("hidden",modul==="stat");
  $("fTur").classList.toggle("hidden",modul==="xodim"||modul==="planbaby");
  $("fValyuta").classList.toggle("hidden",modul==="planbaby");
  $("qidiruv").placeholder = modul==="xodim"?"F.I.O., lavozim yoki № bo'yicha qidirish"
    : modul==="planbaby"?"Sarlavha yoki izoh bo'yicha qidirish":"Nomi, kategoriya yoki № bo'yicha qidirish";
}

/* ═══════════ FILTR ═══════════ */
function filtrlangan(){
  const q=$("qidiruv").value.trim().toLowerCase();
  const t=$("fTur").value, oy=$("fOy").value, v=$("fValyuta").value;
  return data.filter(function(y){
    if((y.modul||"xodim")!==modul) return false;
    if(modul==="xodim" && bolimFiltr && y.bolim!==bolimFiltr) return false;
    if(modul!=="xodim" && modul!=="planbaby" && t!=="hammasi" && (y.tur||"chiqim")!==t) return false;
    if(modul!=="planbaby" && v!=="hammasi" && val(y.valyuta)!==v) return false;
    if(oy && String(y.sana||"").indexOf(oy)!==0) return false;
    if(!q) return true;
    return [y.fio,y.lavozim,y.bolim,y.nomi,y.kategoriya,y.izoh,y.no].join(" ").toLowerCase().indexOf(q)>=0;
  }).sort(function(a,b){ return (b.no||0)-(a.no||0); });
}
function bolimSet(b){ bolimFiltr=(bolimFiltr===b)?null:b; chiz(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ═══════════ KPI ═══════════ */
function kpiChiz(r){
  function yig(f){ const o={UZS:0,USD:0}; r.filter(f).forEach(function(y){ o[val(y.valyuta)]+=summa(y); }); return o; }
  function ikki(o){ return pul(o.UZS)+" so'm"+(o.USD?"<u>$"+pul(o.USD)+"</u>":""); }
  let k=[];
  if(modul==="xodim"){
    const jami=yig(function(){return true;}), kpi={UZS:0,USD:0}, jar={UZS:0,USD:0}, nav={UZS:0,USD:0};
    r.forEach(function(y){ const v=val(y.valyuta);
      kpi[v]+=son(y.kpi)+son(y.lab)+son(y.opkpi)+son(y.konskpi)+son(y.narkozk)+son(y.narkozb);
      jar[v]+=son(y.jarima); nav[v]+=son(y.navbat); });
    k=[["Jami to'lov",ikki(jami),"var(--navy)"],["KPI bonuslar",ikki(kpi),"var(--green)"],
       ["Navbatchilik",ikki(nav),"var(--teal)"],["Jarimalar",ikki(jar),"var(--amber)"],
       ["Xodimlar",r.length,"var(--soft)"]];
  } else if(modul==="planbaby"){
    k=[["Yozuvlar",r.length,"var(--violet)"]];
  } else {
    const ki=yig(function(y){return (y.tur||"chiqim")==="kirim";}), ch=yig(function(y){return (y.tur||"chiqim")==="chiqim";});
    const bU=ki.UZS-ch.UZS, bD=ki.USD-ch.USD;
    k=[["Kirim",ikki(ki),"var(--green)"],["Chiqim",ikki(ch),"var(--rose)"],
       ["Balans",(bU>=0?"+":"−")+pul(Math.abs(bU))+" so'm"+(bD?"<u>"+(bD>=0?"+":"−")+"$"+pul(Math.abs(bD))+"</u>":""),bU>=0?"var(--green)":"var(--rose)"],
       ["Yozuvlar",r.length,"var(--soft)"]];
  }
  $("kpis").innerHTML=k.map(function(x){ return `<div class="kpi"><b class="mono" style="color:${x[2]}">${x[1]}</b><span>${x[0]}</span></div>`; }).join("");
}

/* ═══════════ CHIZISH ═══════════ */

    }).join("")+(bolimFiltr?`<button class="btn btn-sm" onclick="bolimSet(null)" style="align-self:center">Barchasi ✕</button>`:"");

      <button class="btn btn-main" onclick="yangiOch()">${MODUL[modul].qosh}</button></div>`;

function xodimQator(y){

  const QISQA={oylik:"Oylik",kpi:"KPI",opkpi:"Operatsiya KPI",konskpi:"Konsultatsiya KPI",

  const qism=Object.keys(QISQA).filter(function(k){ return son(y[k]); }).map(function(k){
    if(k==="jarima") return "Jarima −"+pul(son(y.jarima));
    if(k==="navbat") return "Navbat "+pul(son(y.navbat))+(son(y.navbatKun)?" ("+son(y.navbatKun)+" kun)":"");
    if(k==="oylik")  return "Oylik "+pul(son(y.oylik));
    return QISQA[k]+" +"+pul(son(y[k]));
  });
  return `<div class="qator" style="border-left:3px solid var(--navy)">

        ${y.bolim?`<span class="bolim" style="background:${br.bg};color:${br.c}">${esc(y.bolim)}</span>`:""}
        ${y.sana?`<span class="mono" style="font-size:11.5px;color:var(--soft)">${sana(y.sana)}</span>`:""}
      </div>
      ${y.lavozim?`<div style="font-size:13px;color:var(--soft)">${esc(y.lavozim)}</div>`:""}
      ${qism.length?`<div class="mono" style="display:flex;flex-wrap:wrap;gap:3px 16px;font-size:12px;color:var(--soft);margin-top:4px">${qism.map(function(x){return "<span>"+esc(x)+"</span>";}).join("")}</div>`:""}
      ${y.izoh?`<div style="font-size:13px;color:var(--soft);margin-top:5px;font-style:italic">${esc(y.izoh)}</div>`:""}
    </div>
    <div class="acts" style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">

}

/* ═══════════ STATISTIKA ═══════════ */
function chizStat(){
  const X=data.filter(function(y){ return (y.modul||"xodim")==="xodim"; });
  const M=data.filter(function(y){ return y.modul==="moliya"; });
  const L=data.filter(function(y){ return y.modul==="lab"; });

  const b={};
  X.forEach(function(y){
    const k=y.bolim||"Ko'rsatilmagan";
    if(!b[k]) b[k]={oylik:0,kpi:0,jarima:0,navbat:0,jami:0,soni:0};
    const v=val(y.valyuta), s=function(x){ return somga(son(x),v); };
    b[k].oylik+=s(y.oylik);
    b[k].kpi+=s(y.kpi)+s(y.lab)+s(y.opkpi)+s(y.konskpi)+s(y.narkozk)+s(y.narkozb);
    b[k].jarima+=s(y.jarima);
    b[k].navbat+=s(y.navbat); b[k].jami+=somga(jamiXodim(y),v); b[k].soni++;
  });
  const arr=Object.keys(b).map(function(n){ return Object.assign({nom:n},b[n]); }).sort(function(a,c){ return c.jami-a.jami; });
  const maxi=Math.max.apply(null,[1].concat(arr.map(function(x){return x.jami;})));
  const jamiOylik=arr.reduce(function(s,x){ return s+x.jami; },0);

  const lab={daromad:0,reagent:0,oylik:0,kpi:0,boshqa:0};
  L.forEach(function(y){
    const s=somga(son(y.summa),val(y.valyuta)), k=y.kategoriya||"";
    if((y.tur||"chiqim")==="kirim") lab.daromad+=s;
    else if(k==="Reagent xaridi"||k==="Sarf materiallar") lab.reagent+=s;
    else if(k==="Xodim oyligi") lab.oylik+=s;
    else if(k==="Xodim KPI") lab.kpi+=s;
    else lab.boshqa+=s;
  });
  const labChiqim=lab.reagent+lab.oylik+lab.kpi+lab.boshqa;
  const labFoyda=lab.daromad-labChiqim;

  let uKirim=0,uChiqim=0;
  M.forEach(function(y){ const s=somga(son(y.summa),val(y.valyuta));
    if((y.tur||"chiqim")==="kirim") uKirim+=s; else uChiqim+=s; });
  const umumKirim=uKirim+lab.daromad;
  const umumChiqim=uChiqim+labChiqim+jamiOylik;

  const o={};
  data.forEach(function(y){
    const k=String(y.sana||"").slice(0,7); if(!k) return;
    if(!o[k]) o[k]={kirim:0,chiqim:0,oylik:0};
    const m=y.modul||"xodim", s=somga(summa(y),val(y.valyuta));
    if(m==="xodim"){ o[k].oylik+=s; o[k].chiqim+=s; }
    else if(m==="moliya"||m==="lab"){ if((y.tur||"chiqim")==="kirim") o[k].kirim+=s; else o[k].chiqim+=s; }
  });
  const oylar=Object.keys(o).sort().reverse().slice(0,12);

  function kartochka(nom,qiy,rang){
    return `<div class="kpi" style="min-width:170px"><b class="mono" style="color:${rang}">${pul(qiy)} so'm</b><span>${nom}</span></div>`;
  }

  $("statView").innerHTML=`
   <div class="row" style="margin-bottom:16px">
     ${kartochka("Umumiy kirim",umumKirim,"var(--green)")}
     ${kartochka("Umumiy chiqim",umumChiqim,"var(--rose)")}
     ${kartochka("Sof balans",umumKirim-umumChiqim,(umumKirim-umumChiqim)>=0?"var(--green)":"var(--rose)")}
     ${kartochka("Oyliklarga ketdi",jamiOylik,"var(--navy)")}
   </div>
   <p style="font-size:12px;color:var(--soft);margin:-6px 0 18px">Dollar summalar 1 USD = ${pul(kurs())} so'm kursida qo'shilgan (Sozlamadan o'zgartiriladi).</p>

   <div class="card" style="padding:20px;margin-bottom:16px">
     <h2 class="disp" style="font-size:17px;margin:0 0 4px">Bo'limlar kesimi — oyliklar</h2>
     <p style="font-size:13px;color:var(--soft);margin:0 0 16px">Har bo'limga qancha to'lov ketgani.</p>
     ${arr.length?`<div style="overflow-x:auto"><table class="tbl">
       <tr><th>Bo'lim</th><th style="text-align:right">Oylik</th><th style="text-align:right">KPI</th>
           <th style="text-align:right">Navbat</th><th style="text-align:right">Jarima</th><th style="text-align:right">Jami</th></tr>
       ${arr.map(function(x){ return `<tr>
         <td><b>${esc(x.nom)}</b> <span style="color:var(--soft);font-size:12px">· ${x.soni}</span>
           <div class="bar" style="margin-top:5px"><div style="width:${x.jami/maxi*100}%;height:100%;background:var(--navy)"></div></div></td>
         <td class="mono" style="text-align:right">${pul(x.oylik)}</td>
         <td class="mono" style="text-align:right;color:var(--green)">+${pul(x.kpi)}</td>
         <td class="mono" style="text-align:right">${pul(x.navbat)}</td>
         <td class="mono" style="text-align:right;color:var(--rose)">−${pul(x.jarima)}</td>
         <td class="mono" style="text-align:right;font-weight:600">${pul(x.jami)}</td></tr>`; }).join("")}
       <tr style="border-top:2px solid var(--rule)"><td><b>JAMI</b></td><td colspan="4"></td>
         <td class="mono" style="text-align:right;font-weight:700;color:var(--navy)">${pul(jamiOylik)}</td></tr>
     </table></div>`:`<p style="font-size:14px;color:var(--soft)">Ma'lumot yo'q.</p>`}
   </div>

   <div class="card" style="padding:20px;margin-bottom:16px">
     <h2 class="disp" style="font-size:17px;margin:0 0 4px">Laboratoriya hisoboti</h2>
     <p style="font-size:13px;color:var(--soft);margin:0 0 16px">Daromad, reagent xarajati va xodimlarga to'lovlar.</p>
     <div class="row">
       ${kartochka("Daromad",lab.daromad,"var(--green)")}
       ${kartochka("Reagent / material",lab.reagent,"var(--rose)")}
       ${kartochka("Xodim oyligi",lab.oylik,"var(--navy)")}
       ${kartochka("Xodim KPI",lab.kpi,"var(--teal)")}
       ${kartochka("Boshqa xarajat",lab.boshqa,"var(--amber)")}
       ${kartochka("Sof foyda",labFoyda,labFoyda>=0?"var(--green)":"var(--rose)")}
     </div>
     ${lab.daromad?`<p style="font-size:13px;color:var(--soft);margin:14px 0 0">
       Rentabellik: <b style="color:${labFoyda>=0?"var(--green)":"var(--rose)"}">${Math.round(labFoyda/lab.daromad*100)}%</b>
       · Har 100 000 so'm daromaddan ${pul(labChiqim/lab.daromad*100000)} so'm xarajatga ketmoqda.</p>`:""}
   </div>

   <div class="card" style="padding:20px">
     <h2 class="disp" style="font-size:17px;margin:0 0 16px">Oylar bo'yicha</h2>
     ${oylar.length?`<div style="overflow-x:auto"><table class="tbl">
       <tr><th>Oy</th><th style="text-align:right">Kirim</th><th style="text-align:right">Oyliklar</th>
           <th style="text-align:right">Jami chiqim</th><th style="text-align:right">Balans</th></tr>
       ${oylar.map(function(k){ const v=o[k], n=v.kirim-v.chiqim; return `<tr>
         <td>${oyNomi(k)}</td>
         <td class="mono" style="text-align:right;color:var(--green)">${pul(v.kirim)}</td>
         <td class="mono" style="text-align:right;color:var(--navy)">${pul(v.oylik)}</td>
         <td class="mono" style="text-align:right;color:var(--rose)">${pul(v.chiqim)}</td>
         <td class="mono" style="text-align:right;font-weight:600;color:${n>=0?"var(--green)":"var(--rose)"}">${(n>=0?"+":"−")+pul(Math.abs(n))}</td>
       </tr>`; }).join("")}
     </table></div>`:`<p style="font-size:14px;color:var(--soft)">Ma'lumot yo'q.</p>`}
   </div>`;
}

  return `
  <div class="g2">
    <div><label class="lb">Nomi *</label><input id="f_nomi" value="${g("nomi")}" placeholder="${modul==="lab"?"Masalan: Reagent — biokimyo":"Masalan: Bemor to'lovi"}"></div>
    <div><label class="lb">Sana</label><input type="date" id="f_sana" value="${g("sana",bugun())}"></div>
  </div>
  <div class="g2">
    <div><label class="lb">Kategoriya</label><select id="f_kategoriya">${[""].concat(kat).map(function(k){
      return `<option ${g("kategoriya")===k?"selected":""}>${k||"Tanlanmagan"}</option>`; }).join("")}</select></div>
    <div><label class="lb">Summa *</label><input id="f_summa" inputmode="numeric" value="${g("summa")}" placeholder="0"></div>
  </div>
  <div class="g2">
    <div><label class="lb">Turi</label>${turBtn()}</div>
    <div><label class="lb">Valyuta</label>${valBtn()}</div>
  </div>
  <div><label class="lb">Izoh</label><textarea id="f_izoh" rows="2" placeholder="Qo'shimcha ma'lumot">${g("izoh")}</textarea></div>`;
}

function tolovChiz(y){
  const blok=$("tolovBlok"); if(!blok) return;
  const bolim=$("f_bolim")?$("f_bolim").value:"";
  const lst=tolovMaydonlari(bolim==="Tanlanmagan"?"":bolim);
  let html="", buf=[];
  lst.forEach(function(k,i){
    const m=MAYDON[k], eski=y&&y[k]!=null?esc(y[k]):"";
    buf.push(`<div><label class="lb">${m.nom}</label><input id="f_${k}" inputmode="numeric" value="${eski}" placeholder="0"></div>`);
    if(buf.length===3||i===lst.length-1){ html+=`<div class="g3" style="margin-bottom:12px">${buf.join("")}</div>`; buf=[]; }
  });
  blok.innerHTML=html;
  const nomlar=lst.filter(function(k){ return !MAYDON[k].hisobsiz; })
    .map(function(k){ return (MAYDON[k].minus?"− ":"")+MAYDON[k].nom.replace(" (−)","").replace(" (bonus)","").replace(" (dejur)",""); });
  $("jamiIzoh").textContent=nomlar.join(" + ").replace(/\+ −/g,"−");
  lst.forEach(function(k){ $("f_"+k).addEventListener("input",jamiYangila); });
  jamiYangila();
}

function jamiYangila(){
  if(modul!=="xodim"||!$("jamiKorsat")) return;
  const y={};
  Object.keys(MAYDON).forEach(function(k){ y[k]=$("f_"+k)?$("f_"+k).value:""; });
  $("jamiKorsat").textContent=pulV(jamiXodim(y),formVal);
}

function formaOch(y){
  $("formBody").innerHTML=formaChiz(y);
  if(modul==="xodim"){
    tolovChiz(y);
    $("f_bolim").addEventListener("change",function(){ tolovChiz(null); });
  }
  $("formModal").classList.remove("hidden");
  const f=$("f_fio")||$("f_nomi"); if(f) f.focus();
}
function yangiOch(){ tahrirId=null; formTur="chiqim"; formVal="UZS";
  $("formTitle").textContent=MODUL[modul].qosh.replace("+ ",""); formaOch(null); }
function tahrirOch(id){ const y=data.filter(function(x){return x.id===id;})[0]; if(!y) return;
  tahrirId=id; formTur=y.tur||"chiqim"; formVal=val(y.valyuta);
  $("formTitle").textContent="Yozuvni tahrirlash"; formaOch(y); }
function formYop(){ $("formModal").classList.add("hidden"); }

async function saqla(){
  const obj={modul:modul, valyuta:formVal};
  function olish(k){ return $("f_"+k)?$("f_"+k).value.trim():""; }
  if(modul==="xodim"){
    obj.fio=olish("fio"); if(!obj.fio){ $("f_fio").focus(); return; }
    ["sana","bolim","lavozim","izoh"].forEach(function(k){ obj[k]=olish(k); });
    Object.keys(MAYDON).forEach(function(k){ obj[k]=olish(k); });
    if(obj.bolim==="Tanlanmagan") obj.bolim="";
    obj.tur="chiqim";
  } else if(modul==="planbaby"){
    obj.nomi=olish("nomi"); if(!obj.nomi){ $("f_nomi").focus(); return; }
    obj.sana=olish("sana"); obj.izoh=olish("izoh"); obj.tur="";
  } else {
    obj.nomi=olish("nomi"); if(!obj.nomi){ $("f_nomi").focus(); return; }
    ["sana","kategoriya","summa","izoh"].forEach(function(k){ obj[k]=olish(k); });
    if(obj.kategoriya==="Tanlanmagan") obj.kategoriya="";
    obj.tur=formTur;
  }
  if(tahrirId){
    let i=-1; data.forEach(function(x,j){ if(x.id===tahrirId) i=j; });
    data[i]=Object.assign({},data[i],obj); await yoz(data[i],"yangila");
  }else{
    const no=data.reduce(function(m,y){ return Math.max(m,Number(y.no)||0); },0)+1;
    const yangi=Object.assign({},obj,{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),no:no});
    data.unshift(yangi); await yoz(yangi,"qosh");
  }
  formYop(); chiz();
}

function delOch(id){ ochirishId=id; $("delModal").classList.remove("hidden"); }
function delYop(){ ochirishId=null; $("delModal").classList.add("hidden"); }
async function delTasdiq(){
  const y=data.filter(function(x){return x.id===ochirishId;})[0];
  data=data.filter(function(x){ return x.id!==ochirishId; });
  if(y) await yoz(y,"ochir");
  delYop(); chiz();
}

/* ═══════════ SOZLAMA ═══════════ */
function sozlamaOch(){
  $("s_url").value=cfg.url; $("s_key").value=cfg.key; $("s_kod").value=cfg.kod; $("s_kurs").value=cfg.kurs;
  $("setupErr").textContent=""; $("setupOk").textContent="";
  $("setupModal").classList.remove("hidden");
}
function sozlamaYop(){ $("setupModal").classList.add("hidden"); }
async function sozlamaSaqla(){
  cfg.url=$("s_url").value.trim(); cfg.key=$("s_key").value.trim();
  const eskiKod=cfg.kod; cfg.kod=$("s_kod").value.trim(); cfg.kurs=$("s_kurs").value.trim()||"12800";
  cfgSaqla(); if(cfg.kod&&cfg.kod!==eskiKod) sessiyaSaqla();
  $("setupErr").textContent=""; $("setupOk").textContent="";
  if(cfg.url&&cfg.key){
    try{ await sb(JADVAL+"?select=id&limit=1"); bulut=true;
      $("setupOk").textContent="Bazaga muvaffaqiyatli ulandi ✓"; await yukla();
    }catch(e){ bulut=false; $("setupErr").textContent=e.message; }
  }else{ bulut=false; $("setupOk").textContent="Saqlandi. Yozuvlar shu qurilmada turadi."; }
  gateKorsat(); holatKorsat();
  if(!$("app").classList.contains("hidden")) chiz();
}

/* ═══════════ CSV ═══════════ */
function csvYukla(){
  const sar=["No","Modul","Sana","FIO/Nomi","Bolim","Lavozim","Kategoriya","Turi","Valyuta","Oylik","KPI","OperatsiyaKPI","KonsultatsiyaKPI","KichikNarkoz","KattaNarkoz","LabKPI","Navbat","NavbatKun","Jarima","Summa","Jami","Izoh"];
  const r=(modul==="stat")?data:filtrlangan();
  const q=r.map(function(y){ return [y.no,(MODUL[y.modul||"xodim"]||{}).nom,y.sana,y.fio||y.nomi,y.bolim,y.lavozim,y.kategoriya,
    (TUR[y.tur]||{}).label||"",val(y.valyuta),son(y.oylik),son(y.kpi),son(y.opkpi),son(y.konskpi),
    son(y.narkozk),son(y.narkozb),son(y.lab),son(y.navbat),son(y.navbatKun),
    son(y.jarima),son(y.summa),summa(y),y.izoh]; });
  const csv="\uFEFF"+[sar].concat(q).map(function(x){ return x.map(function(c){ return '"'+String(c==null?"":c).replace(/"/g,'""')+'"'; }).join(";"); }).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="moliya-"+bugun()+".csv"; a.click();
}

/* ═══════════ ISHGA TUSHIRISH ═══════════ */
["qidiruv","fTur","fOy","fValyuta"].forEach(function(id){ $(id).addEventListener("input",chiz); });
[["formModal",formYop],["setupModal",sozlamaYop],["delModal",delYop]].forEach(function(p){
  $(p[0]).addEventListener("click",function(e){ if(e.target.id===p[0]) p[1](); });
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ formYop(); sozlamaYop(); delYop(); } });

cfgYukla();
if(cfg.kod&&sessiyaBormi()){ kir(); } else { gateKorsat(); $("gateInput").focus(); }
</script>
